<svg xmlns="http://www.w3.org/2000/svg" width="760" viewBox="0 0 760 250"><defs><marker id="tf-ar" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#555555"/></marker><marker id="tf-arr" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#d63426"/></marker><linearGradient id="tf-pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfaf8"/><stop offset="1" stop-color="#eef4f5"/></linearGradient><linearGradient id="tf-band" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6efe8"/><stop offset="1" stop-color="#eef4f5"/></linearGradient></defs><rect x="0.5" y="0.5" width="759" height="249" rx="10" fill="url(#tf-pg)" stroke="#e2e6e8"/><line x1="86" y1="206" x2="86" y2="34" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="3,3"/><text x="86" y="220" font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="8.5" fill="#666666" text-anchor="middle">4 KiB</text><line x1="195.714" y1="206" x2="195.714" y2="34" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="3,3"/><text x="195.714" y="220" font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="8.5" fill="#666666" text-anchor="middle">1 MiB</text><line x1="286.83" y1="206" x2="286.83" y2="34" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="3,3"/><text x="286.83" y="220" font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="8.5" fill="#666666" text-anchor="middle">100 MiB</text><line x1="332.857" y1="206" x2="332.857" y2="34" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="3,3"/><text x="332.857" y="220" font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="8.5" fill="#666666" text-anchor="middle">1 GiB</text><line x1="470" y1="206" x2="470" y2="34" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="3,3"/><text x="470" y="220" font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="8.5" fill="#666666" text-anchor="middle">1 TiB</text><line x1="86" y1="190.364" x2="470" y2="190.364" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="3,3"/><text x="80" y="193.364" font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="8.5" fill="#666666" text-anchor="end">1 KB</text><line x1="86" y1="143.455" x2="470" y2="143.455" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="3,3"/><text x="80" y="146.455" font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="8.5" fill="#666666" text-anchor="end">1 MB</text><line x1="86" y1="96.5455" x2="470" y2="96.5455" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="3,3"/><text x="80" y="99.5455" font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="8.5" fill="#666666" text-anchor="end">1 GB</text><line x1="86" y1="49.6364" x2="470" y2="49.6364" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="3,3"/><text x="80" y="52.6364" font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="8.5" fill="#666666" text-anchor="end">1 TB</text><line x1="86" y1="206" x2="470" y2="206" stroke="#666666" stroke-width="1"/><line x1="86" y1="206" x2="86" y2="34" stroke="#666666" stroke-width="1"/><text x="278" y="234" font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="8.5" fill="#666666" text-anchor="middle">object size</text><text x="26" y="22" font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="8.5" fill="#666666" text-anchor="start">bytes mined per object</text><path d="M86,180.465 L95.6,177.293 L105.2,174.074 L114.8,170.827 L124.4,167.561 L134,164.285 L143.6,161.001 L153.2,157.713 L162.8,154.422 L172.4,151.13 L182,147.837 L191.6,144.543 L201.2,141.249 L210.8,137.954 L220.4,134.659 L230,131.365 L239.6,128.07 L249.2,124.775 L258.8,121.48 L268.4,118.185 L278,114.89 L287.6,111.595 L297.2,108.301 L306.8,105.006 L316.4,101.711 L326,98.4158 L335.6,95.1209 L345.2,91.826 L354.8,88.5311 L364.4,85.2362 L374,81.9412 L383.6,78.6463 L393.2,75.3514 L402.8,72.0565 L412.4,68.7616 L422,65.4667 L431.6,62.1718 L441.2,58.8769 L450.8,55.582 L460.4,52.2871 L470,48.9921" fill="none" stroke="#555555" stroke-width="1.6"/><path d="M86,191.845 L95.6,191.845 L105.2,191.845 L114.8,191.845 L124.4,191.845 L134,191.845 L143.6,191.845 L153.2,191.845 L162.8,191.845 L172.4,191.845 L182,191.845 L191.6,191.845 L201.2,191.845 L210.8,191.845 L220.4,191.845 L230,191.42 L239.6,191.019 L249.2,190.641 L258.8,189.618 L268.4,188.73 L278,187.021 L287.6,185.312 L297.2,182.93 L306.8,180.396 L316.4,177.574 L326,174.582 L335.6,171.453 L345.2,168.314 L354.8,165.086 L364.4,161.853 L374,158.583 L383.6,155.313 L393.2,152.028 L402.8,148.741 L412.4,145.45 L422,142.158 L431.6,138.865 L441.2,135.571 L450.8,132.277 L460.4,128.982 L470,125.687" fill="none" stroke="#d63426" stroke-width="2"/><text x="354.286" y="76.6483" font-family="Liberation Sans, IBM Plex Sans, Arial, sans-serif" font-size="9.5" fill="#2b2b2b" text-anchor="end">the object mined as data</text><text x="92" y="182.845" font-family="Liberation Sans, IBM Plex Sans, Arial, sans-serif" font-size="9.5" fill="#d63426" text-anchor="start" font-weight="bold">the object carried, its proof mined</text><line x1="205.714" y1="187.845" x2="205.714" y2="147.131" stroke="#555555" stroke-width="0.9" marker-end="url(#tf-ar)"/><text x="211.714" y="170.488" font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="8.5" fill="#2b2b2b" text-anchor="start">1,300 to 1</text><line x1="342.857" y1="168.411" x2="342.857" y2="100.062" stroke="#555555" stroke-width="0.9" marker-end="url(#tf-ar)"/><text x="348.857" y="137.237" font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="8.5" fill="#2b2b2b" text-anchor="start">76,000 to 1</text><line x1="486" y1="16" x2="486" y2="234" stroke="#e2e6e8" stroke-width="1"/><text x="500" y="40" font-family="Liberation Sans, IBM Plex Sans, Arial, sans-serif" font-size="11" fill="#2b2b2b" text-anchor="start" font-weight="bold">two flows, one proof</text><text x="500" y="68" font-family="Liberation Sans, IBM Plex Sans, Arial, sans-serif" font-size="9.5" fill="#d63426" text-anchor="start" font-weight="bold">bytes:</text><text x="544" y="68" font-family="Liberation Sans, IBM Plex Sans, Arial, sans-serif" font-size="9" fill="#2b2b2b" text-anchor="start">ride the data carrier, never mined,</text><text x="544" y="81" font-family="Liberation Sans, IBM Plex Sans, Arial, sans-serif" font-size="9" fill="#2b2b2b" text-anchor="start">delivered once to every provider</text><text x="500" y="106" font-family="Liberation Sans, IBM Plex Sans, Arial, sans-serif" font-size="9.5" fill="#d63426" text-anchor="start" font-weight="bold">proof:</text><text x="544" y="106" font-family="Liberation Sans, IBM Plex Sans, Arial, sans-serif" font-size="9" fill="#2b2b2b" text-anchor="start">one mined funding output per piece,</text><text x="544" y="119" font-family="Liberation Sans, IBM Plex Sans, Arial, sans-serif" font-size="9" fill="#2b2b2b" text-anchor="start">the hold output, the settlement</text><text x="500" y="144" font-family="Liberation Sans, IBM Plex Sans, Arial, sans-serif" font-size="9.5" fill="#d63426" text-anchor="start" font-weight="bold">link:</text><text x="544" y="144" font-family="Liberation Sans, IBM Plex Sans, Arial, sans-serif" font-size="9" fill="#2b2b2b" text-anchor="start">each carrier spends a mined output;</text><text x="544" y="157" font-family="Liberation Sans, IBM Plex Sans, Arial, sans-serif" font-size="9" fill="#2b2b2b" text-anchor="start">the token commits to the carrier's txid</text><text x="500" y="192" font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="8.5" fill="#666666" text-anchor="start">a 1 GiB put mines about 14 KB</text><text x="500" y="205" font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="8.5" fill="#666666" text-anchor="start">more objects cost more proofs, not more bytes</text><text x="500" y="218" font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="8.5" fill="#666666" text-anchor="start">small objects gain least: under 1 MiB the proof</text><text x="500" y="231" font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="8.5" fill="#666666" text-anchor="start">is a real share of the object</text></svg>