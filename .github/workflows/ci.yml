name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
      - name: gofmt
        run: make fmt-check
      - name: vet
        run: make vet
      # The direct dependencies are exactly go-sdk and bcommon, go.mod is
      # tidy, nothing is replaced, and go-sdk resolves to exactly v1.7.1.
      - name: dependency set
        run: make deps-check
      # LICENSE-THIRD-PARTY matches what the binaries link.
      - name: third-party licences
        run: make licences
      - name: test
        run: make go-test
      - name: page checks against the oracle
        run: make go-oracle
      # Regenerates the vectors and compares them byte for byte, so a stale
      # vector or one nothing generates fails here.
      - name: vectors match the Go codec
        run: make vectors-check

  # The TypeScript twin runs every Go-generated vector, so a change that
  # moves the bytes on one side and not the other fails in one job or the
  # other.
  ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: host/package-lock.json
      - run: npm ci
      - name: typecheck
        run: npm run check
      - name: test
        run: npm test
