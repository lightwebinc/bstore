name: image-publish

# Manual, gated image publish of ghcr.io/lightwebinc/bstore (the command and
# the S3 gateway, the Dockerfile's default target). No automated trigger.
# bstore-provider, bstore-devchain and bstore-host are built locally
# (make docker-build, make docker-build-host).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RELEASE to publish image to ghcr.io'
        required: true
      tag:
        description: 'Image tag, a released version without the v (e.g. 0.6.1)'
        required: true
      dry-run:
        description: 'Build only, push nothing'
        type: boolean
        default: false

jobs:
  publish:
    if: inputs.confirm == 'RELEASE'
    permissions:
      contents: read
      packages: write
    uses: lightwebinc/ci/.github/workflows/image-publish.yml@a5956ef6306c9df9ea212546ebe3e240b5315669 # v0.5.2
    with:
      runs-on: '["self-hosted", "lax"]'
      tag: ${{ inputs.tag }}
      environment: ""
      dry-run: ${{ inputs.dry-run }}
