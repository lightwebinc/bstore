name: image-publish

# Manual, gated publish of the four images the quickstart and the self-host
# docs pull: bstore (the command and the S3 gateway), bstore-provider,
# bstore-devchain and bstore-host. No automated trigger.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RELEASE to publish the images to ghcr.io'
        required: true
      tag:
        description: 'Image tag, a released version without the v (e.g. 0.11.0); the git tag v<tag> must exist'
        required: true
      dry-run:
        description: 'Build only, push nothing'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: inputs.confirm == 'RELEASE'
    runs-on: ubuntu-latest
    env:
      # The reference overlay host image the host module is added to: the
      # repository variable REFERENCE_HOST_IMAGE (an exact tag), else the one
      # the quickstart is checked against.
      REFERENCE_HOST_IMAGE: ${{ vars.REFERENCE_HOST_IMAGE || 'ghcr.io/lightwebinc/overlay-blueprints:0.2.2' }}
    steps:
      # Build from the git tag being published: input '0.11.0' -> tag
      # 'v0.11.0'. Checkout fails the run if that tag does not exist.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/v${{ inputs.tag }}

      # The host image's last stage runs a command in the target platform's
      # base image, so the arm64 build needs emulation.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        if: ${{ !inputs.dry-run }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push bstore
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: bstore
          platforms: linux/amd64,linux/arm64
          push: ${{ !inputs.dry-run }}
          provenance: false
          tags: |
            ghcr.io/lightwebinc/bstore:${{ inputs.tag }}
            ghcr.io/lightwebinc/bstore:latest
          build-args: |
            VERSION=${{ inputs.tag }}

      - name: Build and push bstore-provider
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: provider
          platforms: linux/amd64,linux/arm64
          push: ${{ !inputs.dry-run }}
          provenance: false
          tags: |
            ghcr.io/lightwebinc/bstore-provider:${{ inputs.tag }}
            ghcr.io/lightwebinc/bstore-provider:latest
          build-args: |
            VERSION=${{ inputs.tag }}

      - name: Build and push bstore-devchain
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: devchain
          platforms: linux/amd64,linux/arm64
          push: ${{ !inputs.dry-run }}
          provenance: false
          tags: |
            ghcr.io/lightwebinc/bstore-devchain:${{ inputs.tag }}
            ghcr.io/lightwebinc/bstore-devchain:latest
          build-args: |
            VERSION=${{ inputs.tag }}

      - name: Build and push bstore-host
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: host/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ !inputs.dry-run }}
          provenance: false
          tags: |
            ghcr.io/lightwebinc/bstore-host:${{ inputs.tag }}
            ghcr.io/lightwebinc/bstore-host:latest
          build-args: |
            REFERENCE_HOST_IMAGE=${{ env.REFERENCE_HOST_IMAGE }}
